      drawerNav.classList.add("drawer-active");
      drawerOverlay.classList.remove("opacity-0", "pointer-events-none");
      drawerOverlay.classList.add("opacity-100");
    }

    function closeDrawer() {
      drawerNav.classList.remove("drawer-active");
      drawerNav.classList.add("drawer-hidden");
      drawerOverlay.classList.remove("opacity-100");
      drawerOverlay.classList.add("opacity-0", "pointer-events-none");
    }

    btnOpenIndex.addEventListener("click", openDrawer);
    btnCloseIndex.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);
    btnOverview.addEventListener("click", openDrawer);

    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    });

    document.getElementById("headerLogoImg").src = LOGO_IMG_SRC;
    buildIndex();
    renderSlide();
  </script>
</body>
</html>
